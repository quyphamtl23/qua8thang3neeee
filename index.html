<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galaxy Love</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
}

.world{
position:absolute;
top:0;
left:0;
width:2500px;
height:2500px;
transform-origin:0 0;
}

.center{
position:absolute;
top:1200px;
left:1200px;
font-size:32px;
text-align:center;
text-shadow:0 0 20px white;
max-width:600px;
pointer-events:none;
z-index:10;
}

.photo{
position:absolute;
width:150px;
height:100px;
border-radius:14px;
overflow:hidden;
box-shadow:0 0 20px rgba(255,255,255,0.8);
transition:0.3s;
z-index:1;
}

.photo:hover{
transform:scale(1.2);
box-shadow:0 0 30px pink;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

button{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:15px 30px;
font-size:20px;
border:none;
background:#ff4d88;
color:white;
border-radius:12px;
cursor:pointer;
z-index:10;
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<button id="start">Ấn vào đây đi nè lovers❤️</button>

<div id="main" style="display:none">

<div class="world" id="world">

<div class="center" id="text"></div>

</div>

</div>

<audio id="music" loop>
<source src="music.mp3">
</audio>

<script>

/* TEXT */

const texts=[
"Chúc mấy cô gái luôn vui vẻ🎉🎉🎉",
"8/3 thật hạnh phúc nháaa😆😆",
"Mong rằng chúng mình sẽ có thêm nhiều kỷ niệm đẹp❤️❤️❤️❤️",
"Hy vọng cuộc đời sẽ nhẹ nhàng với những đoá hoa xinh đẹp này🫶🫶🫶🫶"
]

let ti=0

function changeText(){
document.getElementById("text").innerText=texts[ti]
ti++
if(ti>=texts.length)ti=0
}

setInterval(changeText,4000)

/* START */

document.getElementById("start").onclick=()=>{
document.getElementById("start").style.display="none"
document.getElementById("main").style.display="block"
document.getElementById("music").play()
changeText()
}

/* STAR BACKGROUND */

const canvas=document.getElementById("stars")
const ctx=canvas.getContext("2d")

function resize(){
canvas.width=window.innerWidth
canvas.height=window.innerHeight
}
resize()

window.addEventListener("resize",resize)

let stars=[]

for(let i=0;i<300;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2
})
}

function draw(){

ctx.fillStyle="black"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="white"

stars.forEach(s=>{

ctx.beginPath()
ctx.arc(s.x,s.y,s.size,0,Math.PI*2)
ctx.fill()

s.y+=0.4

if(s.y>canvas.height){
s.y=0
s.x=Math.random()*canvas.width
}

})

requestAnimationFrame(draw)

}

draw()

/* IMAGES */

const images=[
"1.jpg","2.jpg","3.jpg","4.jpg","5.jpg","6.jpg","7.jpg","8.jpg",
"9.jpg","10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg",
"17.jpg","18.jpg","19.jpg","20.jpg","21.jpg","22.jpg","23.jpg","24.jpg",
"25.jpg","26.jpg","27.jpg","28.jpg"
]

const world=document.getElementById("world")

const total=100

let placed=[]

for(let i=0;i<total;i++){

let x,y,ok

do{

x=Math.random()*2300
y=Math.random()*2300
ok=true

placed.forEach(p=>{
let dx=p.x-x
let dy=p.y-y
let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<180) ok=false
})

}while(!ok)

placed.push({x,y})

let div=document.createElement("div")
div.className="photo"

div.style.left=x+"px"
div.style.top=y+"px"

let img=document.createElement("img")

img.src=images[i%images.length]

img.onerror=()=>{
img.src="https://picsum.photos/300/200"
}

div.appendChild(img)

world.appendChild(div)

}

/* CAMERA */

let zoom=1
let posX=window.innerWidth/2-1200
let posY=window.innerHeight/2-1200

function updateCamera(){
world.style.transform=
`translate(${posX}px,${posY}px) scale(${zoom})`
}

updateCamera()

/* ZOOM */

document.addEventListener("wheel",(e)=>{

zoom+=e.deltaY*-0.001

if(zoom<0.4)zoom=0.4
if(zoom>3)zoom=3

updateCamera()

})

/* DRAG */

let dragging=false
let startX,startY

document.addEventListener("mousedown",(e)=>{
dragging=true
startX=e.clientX
startY=e.clientY
})

document.addEventListener("mouseup",()=>{
dragging=false
})

document.addEventListener("mousemove",(e)=>{

if(!dragging)return

posX+=e.clientX-startX
posY+=e.clientY-startY

startX=e.clientX
startY=e.clientY

updateCamera()

})

</script>

</body>
</html>
